<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070912"><title>Login — JMB Portal</title><link rel="icon" href="../assets/icons/favicon.svg"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"></head><body class="auth-body"><div class="auth-bg"></div><main class="auth-wrap"><a class="brand auth-brand" href="../index.html"><span class="brand-mark">J</span><span><b>JMB</b><small>PORTAL</small></span></a><section class="auth-card glass"><div class="auth-head"><div class="eyebrow">SECURE ENTRY</div><h1>Welcome to JMB.</h1><p id="authSub">Sign in to open your dashboard.</p></div><div id="authError" class="notice danger hide"></div><div class="socials"><button id="googleBtn" class="btn btn-social">Continue with Google</button><button id="discordBtn" class="btn btn-social">Continue with Discord</button></div><div class="divider"><span>or use email</span></div><div id="authForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button id="submitBtn" class="btn btn-primary wide">Sign In →</button><button id="forgotBtn" class="text-btn">Forgot password?</button></div><div class="auth-bottom"><span id="modeText">New to JMB Portal?</span><button id="modeBtn" class="link-btn">Create account</button></div></section><p class="auth-foot">Firebase powers authentication and data. Your secrets stay server-side.</p></main><script type="module" src="../js/auth/login.js"></script></body></html>
