name: Validate JMB HUB
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: JavaScript and config checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Validate JSON configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            '.firebaserc',
            'firebase.json',
            'firestore.indexes.json',
            'site.webmanifest',
            'functions/package.json'
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('Valid JSON:', file);
          }
          NODE
