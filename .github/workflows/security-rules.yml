name: Firebase security rules tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    name: Firestore and Storage emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Firebase emulator test dependencies
        run: npm install --no-save --package-lock=false firebase-tools@latest firebase@12.1.0 @firebase/rules-unit-testing@latest
      - name: Test Firebase rules in local emulators
        run: npx firebase emulators:exec --only firestore,storage --project demo-jmbhub "node --test tests/security-rules.test.cjs"
