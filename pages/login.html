<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.cloudfunctions.net; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; upgrade-insecure-requests"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070912"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="description" content="JMBHUB account access">
<title>JMBHUB — Sign in</title><link rel="icon" href="../assets/icons/favicon.svg">
<link rel="preconnect" href="https://www.gstatic.com"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
<div class="auth-bg"></div>
<div class="auth-orb orb-one"></div><div class="auth-orb orb-two"></div>
<main class="auth-wrap">
  <a class="brand auth-brand" href="../index.html"><span class="brand-mark">J</span><span><b>JMB</b><small>HUB</small></span></a>
  <section class="auth-card glass">
    <div class="auth-head">
      <div class="eyebrow">YOUR SPACE</div>
      <h1 id="authTitle">Welcome back.</h1>
      <p id="authSub">Sign in to continue to JMBHUB.</p><div class="auth-mini-note">Fast access · Mobile ready · One account across JMBHUB</div>
    </div>
    <div id="authError" class="notice danger hide" role="alert"></div>
    <div class="login-pulse"><span></span><b>Secure sign-in</b><em>Protected connection</em></div>
    <div class="socials">
      <button id="googleBtn" class="btn btn-social" type="button" aria-label="Continue with Google"><span class="social-icon">G</span><span>Continue with Google</span></button>
      <button id="discordBtn" class="btn btn-social" type="button" aria-label="Continue with Discord"><span class="social-icon">◈</span><span>Continue with Discord</span></button>
    </div>
    <div class="divider"><span>or continue with email</span></div>
    <form id="authForm" novalidate>
      <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
      <div class="field password-field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button></div></div>
      <div id="confirmWrap" class="field password-field hide"><label for="confirmPassword">Confirm password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password"><button type="button" class="password-toggle" id="toggleConfirm" aria-label="Show password">Show</button></div><div class="password-meter"><span id="strengthBar"></span></div><small id="strengthText">Use 8+ characters with a mix of letters and numbers.</small></div>
      <label class="check-row"><input id="remember" type="checkbox" checked><span>Keep me signed in</span></label>
      <button id="submitBtn" class="btn btn-primary wide" type="submit"><span id="submitText">Sign In</span><span>→</span></button>
      <button id="forgotBtn" class="text-btn" type="button">Forgot password?</button>
    </form>
    <div class="auth-bottom"><span id="modeText">New to JMBHUB?</span><button id="modeBtn" class="link-btn" type="button">Create account</button></div>
  </section>
  <p class="auth-foot">© <span id="year"></span> JMBHUB · Your tools. Your games. Your space.</p>
</main>
<script type="module" src="../js/auth/login.js?v=21"></script>
</body>
</html>
