<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — JMBHUB</title><link rel="icon" href="../assets/icons/favicon.png"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/portal.css"></head><body class="app-body"><main class="page container" style="padding-top:50px"><a class="brand page-brand" href="dashboard.html"><span class="brand-mark"><img src="../assets/jmbhub-logo.png" alt="JMB"></span><span><b>JMB</b><small>HUB</small></span></a><div class="page-head"><div><div class="eyebrow">ACCOUNT</div><h1>Profile & Account</h1><p>Edit your JMBHUB profile and account preferences.</p></div><a class="btn btn-ghost" href="dashboard.html">← Dashboard</a></div><div class="grid grid-2"><div class="card"><div class="section-title"><div><div class="eyebrow">PROFILE</div><h3>Personal details</h3></div></div><div class="form-grid"><label>Name<input id="editName" class="tool-input" type="text" maxlength="50" placeholder="Your display name"></label><label>Profile photo URL<input id="editPhoto" class="tool-input" type="url" placeholder="https://..."></label></div><button class="btn btn-primary" id="saveProfile">Save changes</button><p id="profileMsg" class="muted"></p></div><div class="card"><div class="section-title"><div><div class="eyebrow">ACCOUNT</div><h3 id="profileName">Loading…</h3><p class="muted" id="profileEmail">…</p></div></div><p class="muted">Change your password using the secure Firebase password-reset email.</p><button class="btn btn-ghost" id="resetPassword">Send password reset email</button><button class="btn btn-ghost" id="logout" style="margin-left:8px">Log out</button><p id="accountMsg" class="muted"></p></div></div></main><script type="module" src="../js/core/portal.js"></script><script type="module">import {guard,logout} from '../js/core/auth-guard.js';import {auth} from '../js/core/firebase.js';import {updateProfile,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';const u=await guard();const q=s=>document.querySelector(s);q('#profileName').textContent=u.displayName||'JMB User';q('#profileEmail').textContent=u.email||'';q('#editName').value=u.displayName||'';q('#editPhoto').value=u.photoURL||'';q('#logout').onclick=logout;q('#saveProfile').onclick=async()=>{const name=q('#editName').value.trim();const photo=q('#editPhoto').value.trim();try{await updateProfile(auth.currentUser,{displayName:name||null,photoURL:photo||null});q('#profileName').textContent=name||'JMB User';q('#profileMsg').textContent='✓ Profile updated successfully.';q('#profileMsg').style.color='var(--success,#67e8a5)'}catch(e){q('#profileMsg').textContent='Could not update profile: '+(e?.message||'Unknown error')}};q('#resetPassword').onclick=async()=>{if(!u.email)return;q('#accountMsg').textContent='Sending reset email…';try{await sendPasswordResetEmail(auth,u.email);q('#accountMsg').textContent='✓ Password reset email sent.'}catch(e){q('#accountMsg').textContent='Could not send reset email: '+(e?.message||'Unknown error')}};</script></body></html>
