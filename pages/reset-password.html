<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912"><meta name="robots" content="noindex,nofollow,noarchive">
<title>JMBHUB — Reset password</title><link rel="icon" href="../assets/icons/favicon.svg">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"><link rel="stylesheet" href="../css/reset-password.css">
</head>
<body class="auth-body">
<div class="auth-bg"></div><div class="auth-orb orb-one"></div><div class="auth-orb orb-two"></div>
<main class="auth-wrap reset-wrap">
  <a class="brand auth-brand" href="../index.html"><span class="brand-mark">J</span><span><b>JMB</b><small>HUB</small></span></a>
  <section class="auth-card glass reset-card">
    <div class="auth-head">
      <div class="eyebrow">ACCOUNT RECOVERY</div>
      <h1 id="resetTitle">Verify request.</h1>
      <p id="resetSub">Checking your secure reset link…</p>
    </div>
    <div id="resetError" class="notice danger hide" role="alert"></div>
    <div id="resetSuccess" class="notice success hide" role="status"></div>
    <div id="resetVerify" class="reset-content">
      <div class="verify-card"><span class="verify-dot"></span><div><b id="verifyState">Verifying securely…</b><small id="verifyEmail"></small></div></div>
      <div class="reset-timer" id="pageTimer">Expires in 5:00</div>
      <div class="otp-box"><label for="otp">6-digit code <span>optional when using Verify now</span></label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
      <form id="resetForm" class="reset-form" novalidate>
        <div class="field"><label for="newPassword">New password</label><div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Create a new password"><button type="button" class="password-toggle" id="showNew">Show</button></div></div>
        <div class="field"><label for="confirmNew">Confirm new password</label><div class="password-wrap"><input id="confirmNew" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your new password"><button type="button" class="password-toggle" id="showConfirm">Show</button></div></div>
        <button id="resetSubmit" class="btn btn-primary wide" type="submit"><span>Update password</span><span>→</span></button>
      </form>
    </div>
    <a class="reset-back" href="login.html">← Back to sign in</a>
  </section>
  <p class="auth-foot">© <span id="year"></span> JMBHUB · Your tools. Your games. Your space.</p>
</main>
<script type="module" src="../js/auth/reset-password.js?v=1"></script>
</body>
</html>
