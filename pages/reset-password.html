<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#070912">
<title>Reset Password — JMBHUB</title>
<link rel="icon" href="../assets/icons/favicon.svg">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<style>
.reset-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}.reset-card{width:min(560px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(17,20,34,.82);backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.35)}.reset-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.reset-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#456cff);font-weight:900}.reset-card h1{font-size:clamp(32px,8vw,48px);margin:0 0 8px}.reset-card p{color:#9da5c3}.reset-status{margin:22px 0;padding:15px;border-radius:15px;background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.22)}.reset-status.ok{border-color:rgba(75,220,160,.3)}.reset-status.err{border-color:rgba(255,100,120,.35)}.reset-timer{font-size:28px;font-weight:800;letter-spacing:.04em}.reset-form{display:grid;gap:14px}.reset-form label{font-weight:700}.reset-form input{width:100%;box-sizing:border-box;padding:16px 17px;border-radius:15px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045);color:#fff;font:inherit;outline:none}.reset-form input:focus{border-color:#8166ff;box-shadow:0 0 0 4px rgba(129,102,255,.12)}.otp{letter-spacing:.35em;text-align:center;font-size:24px}.reset-actions{display:flex;gap:10px;flex-wrap:wrap}.reset-actions .btn{flex:1;min-width:160px}.hide{display:none!important}.small{font-size:13px}.center{text-align:center}
</style>
</head>
<body class="auth-body">
<main class="reset-wrap"><section class="reset-card">
  <div class="reset-brand"><div class="reset-mark">J</div><div><strong>JMB</strong><small style="display:block;letter-spacing:.25em;opacity:.65">HUB</small></div></div>
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Reset your password.</h1>
  <p>We verify your secure reset link automatically. Your reset session is valid for only 5 minutes.</p>
  <div id="status" class="reset-status">Checking your verification link…</div>
  <div id="timerBox" class="reset-status hide"><div class="small">Time remaining</div><div id="timer" class="reset-timer">05:00</div></div>
  <form id="resetForm" class="reset-form hide">
    <label for="otp">6-digit code</label><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <button id="verifyBtn" class="btn btn-ghost" type="button">Verify code</button>
    <label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter a new password">
    <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Repeat your new password">
    <div class="reset-actions"><button id="saveBtn" class="btn btn-primary" type="submit">Set new password</button><a class="btn btn-ghost" href="login.html">Back to sign in</a></div>
  </form>
  <p id="emailHint" class="small hide"></p>
</section></main>
<script type="module" src="../js/auth/reset-password.js?v=30"></script>
</body></html>
